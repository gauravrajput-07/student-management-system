<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Management System</h1>

    <!-- Add Student Form -->
    <h2>Add Student</h2>

    <form id="studentForm">

        <input
            type="text"
            id="name"
            placeholder="Enter Name"
            required
        >

        <input
            type="number"
            id="rollNumber"
            placeholder="Enter Roll Number"
            required
        >

        <input
            type="text"
            id="class"
            placeholder="Enter Class"
            required
        >

        <input
            type="text"
            id="section"
            placeholder="Enter Section"
            required
        >

        <input
            type="number"
            id="age"
            placeholder="Enter Age"
            required
        >

        <button type="submit">
            Add Student
        </button>

    </form>

    <!-- Dashboard -->
    <h2>Student Dashboard</h2>

    <div class="dashboard">

        <div class="card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="card">
            <h3>Average Age</h3>
            <p id="averageAge">0</p>
        </div>

    </div>

    <!-- Search -->
    <h2>Student List</h2>

    <input
        type="text"
        id="searchInput"
        placeholder="Search Student by Name"
    >

    <button onclick="searchStudents()">
        Search
    </button>

    <button onclick="getStudents()">
        Load Students
    </button>

    <!-- Student Table -->
    <table border="1">

        <thead>

            <tr>
                <th>Name</th>
                <th>Roll Number</th>
                <th>Class</th>
                <th>Section</th>
                <th>Age</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="studentTable">
        </tbody>

    </table>

    <!-- Pagination -->
    <div style="margin-top:20px; text-align:center;">

        <button onclick="previousPage()">
            Previous
        </button>

        <span id="pageNumber" style="margin:0 15px;">
            Page 1
        </span>

        <button onclick="nextPage()">
            Next
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
